{{define "games_edit_modal.html"}}
<script>document.getElementById('modal-title').textContent = 'Edit Game';</script>
<form hx-put="/ui/games/{{.ID}}"
      hx-target="#game-{{.ID}}"
      hx-swap="outerHTML">
  <div class="form-group">
    <label>Title *</label>
    <input type="text" name="title" value="{{.Title}}" required autofocus>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Platform</label>
      <input type="text" name="platform" value="{{.Platform}}">
    </div>
    <div class="form-group">
      <label>Release date</label>
      <input type="text" name="release_date" value="{{.ReleaseDate}}" placeholder="2024-01-15">
    </div>
  </div>
  <div class="form-group">
    <label>Developers</label>
    <textarea name="developers" rows="2">{{joinLines .Developers}}</textarea>
    <p class="form-hint">One developer per line</p>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Publisher</label>
      <input type="text" name="publisher" value="{{.Publisher}}">
    </div>
    <div class="form-group">
      <label>Rating</label>
      <input type="text" name="rating" value="{{.Rating}}">
    </div>
  </div>
  <div class="form-group">
    <label>Genres</label>
    <textarea name="genres" rows="2">{{joinLines .Genres}}</textarea>
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea name="description" rows="3">{{.Description}}</textarea>
  </div>
  <div class="form-group">
    <label>Cover image URL</label>
    <input type="url" name="cover_url" value="{{.CoverURL}}">
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-ghost" @click="closeModal()">Cancel</button>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </div>
</form>
{{end}}
