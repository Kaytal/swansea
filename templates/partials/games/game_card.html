{{define "game_card.html"}}
<div class="book-card" id="game-{{.ID}}">
  {{if .CoverURL}}
    <img class="book-cover" src="{{.CoverURL}}" alt="Cover of {{.Title}}" loading="lazy">
  {{else}}
    <div class="book-cover-placeholder">&#127918;</div>
  {{end}}
  <div class="book-info">
    <p class="book-title">{{.Title}}</p>
    {{if .Platform}}
      <p class="book-authors">{{.Platform}}</p>
    {{end}}
    <p class="book-meta">
      {{if .Developers}}{{join .Developers ", "}}{{end}}
      {{if and .Developers .ReleaseDate}} &middot; {{end}}
      {{if .ReleaseDate}}{{year .ReleaseDate}}{{end}}
    </p>
  </div>
  <div class="book-actions">
    <button class="btn btn-ghost btn-sm"
            hx-get="/ui/games/{{.ID}}/edit"
            hx-target="#modal-body"
            @click="openModal()">
      Edit
    </button>
    <button class="btn btn-danger btn-sm"
            hx-delete="/ui/games/{{.ID}}"
            hx-target="#game-{{.ID}}"
            hx-swap="outerHTML"
            hx-confirm="Remove &ldquo;{{.Title}}&rdquo; from your library?">
      Delete
    </button>
  </div>
</div>
{{end}}
