{{define "games_add_modal.html"}}
<script>document.getElementById('modal-title').textContent = 'Add Game';</script>
<form hx-post="/ui/games"
      hx-target="#book-grid"
      hx-swap="innerHTML">
  <div class="form-group">
    <label>Title *</label>
    <input type="text" name="title" required autofocus>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Platform</label>
      <input type="text" name="platform" placeholder="PS5, PC, Switch…">
    </div>
    <div class="form-group">
      <label>Release date</label>
      <input type="text" name="release_date" placeholder="2024-01-15">
    </div>
  </div>
  <div class="form-group">
    <label>Developers</label>
    <textarea name="developers" rows="2" placeholder="One developer per line"></textarea>
    <p class="form-hint">One developer per line</p>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Publisher</label>
      <input type="text" name="publisher">
    </div>
    <div class="form-group">
      <label>Rating</label>
      <input type="text" name="rating" placeholder="E, T, M…">
    </div>
  </div>
  <div class="form-group">
    <label>Genres</label>
    <textarea name="genres" rows="2" placeholder="One genre per line"></textarea>
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea name="description" rows="3"></textarea>
  </div>
  <div class="form-group">
    <label>Cover image URL</label>
    <input type="url" name="cover_url">
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-ghost" @click="closeModal()">Cancel</button>
    <button type="submit" class="btn btn-primary">Add Game</button>
  </div>
</form>
{{end}}
