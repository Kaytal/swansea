{{define "music_add_modal.html"}}
<script>document.getElementById('modal-title').textContent = 'Add Album';</script>
<form hx-post="/ui/music"
      hx-target="#book-grid"
      hx-swap="innerHTML">
  <div class="form-group">
    <label>Title *</label>
    <input type="text" name="title" required autofocus>
  </div>
  <div class="form-group">
    <label>Artists</label>
    <textarea name="artists" rows="2" placeholder="One artist per line"></textarea>
    <p class="form-hint">One artist per line</p>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Label</label>
      <input type="text" name="label">
    </div>
    <div class="form-group">
      <label>Release date</label>
      <input type="text" name="release_date" placeholder="2024-01-15">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Track count</label>
      <input type="number" name="track_count" min="0">
    </div>
    <div class="form-group">
      <label>Catalog number</label>
      <input type="text" name="catalog_number">
    </div>
  </div>
  <div class="form-group">
    <label>Genres</label>
    <textarea name="genres" rows="2" placeholder="One genre per line"></textarea>
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea name="description" rows="3"></textarea>
  </div>
  <div class="form-group">
    <label>Cover image URL</label>
    <input type="url" name="cover_url">
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-ghost" @click="closeModal()">Cancel</button>
    <button type="submit" class="btn btn-primary">Add Album</button>
  </div>
</form>
{{end}}
