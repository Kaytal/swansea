{{define "movie_card.html"}}
<div class="book-card" id="movie-{{.ID}}">
  {{if .CoverURL}}
    <img class="book-cover" src="{{.CoverURL}}" alt="Cover of {{.Title}}" loading="lazy">
  {{else}}
    <div class="book-cover-placeholder">&#127916;</div>
  {{end}}
  <div class="book-info">
    <p class="book-title">{{.Title}}</p>
    <p class="book-meta">
      {{if .Directors}}{{join .Directors ", "}}{{end}}
      {{if and .Directors .ReleaseDate}} &middot; {{end}}
      {{if .ReleaseDate}}{{year .ReleaseDate}}{{end}}
    </p>
    {{if .Runtime}}
      <p class="book-meta">{{.Runtime}} min</p>
    {{end}}
  </div>
  <div class="book-actions">
    <button class="btn btn-ghost btn-sm"
            hx-get="/ui/movies/{{.ID}}/edit"
            hx-target="#modal-body"
            @click="openModal()">
      Edit
    </button>
    <button class="btn btn-danger btn-sm"
            hx-delete="/ui/movies/{{.ID}}"
            hx-target="#movie-{{.ID}}"
            hx-swap="outerHTML"
            hx-confirm="Remove &ldquo;{{.Title}}&rdquo; from your library?">
      Delete
    </button>
  </div>
</div>
{{end}}
