{{define "movies_add_modal.html"}}
<script>document.getElementById('modal-title').textContent = 'Add Movie';</script>
<form hx-post="/ui/movies"
      hx-target="#book-grid"
      hx-swap="innerHTML">
  <div class="form-group">
    <label>Title *</label>
    <input type="text" name="title" required autofocus>
  </div>
  <div class="form-group">
    <label>Directors</label>
    <textarea name="directors" rows="2" placeholder="One director per line"></textarea>
    <p class="form-hint">One director per line</p>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Studio</label>
      <input type="text" name="studio">
    </div>
    <div class="form-group">
      <label>Release date</label>
      <input type="text" name="release_date" placeholder="2024-01-15">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Runtime (minutes)</label>
      <input type="number" name="runtime" min="0">
    </div>
    <div class="form-group">
      <label>TMDB ID</label>
      <input type="number" name="tmdb_id" min="0">
    </div>
  </div>
  <div class="form-group">
    <label>Genres</label>
    <textarea name="genres" rows="2" placeholder="One genre per line"></textarea>
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea name="description" rows="3"></textarea>
  </div>
  <div class="form-group">
    <label>Cover image URL</label>
    <input type="url" name="cover_url">
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-ghost" @click="closeModal()">Cancel</button>
    <button type="submit" class="btn btn-primary">Add Movie</button>
  </div>
</form>
{{end}}
