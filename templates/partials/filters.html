{{define "filters.html"}}
<aside class="filter-sidebar">
  <div class="filter-section">
    <a class="filter-all"
       href="/"
       hx-get="/ui/books"
       hx-push-url="/"
       hx-target="#book-grid"
       hx-swap="innerHTML">All Books</a>
  </div>

  {{if .Categories}}
  <div class="filter-section">
    <h3 class="filter-heading">Categories</h3>
    <ul class="filter-list">
      {{range .Categories}}
      <li>
        <a class="filter-link"
           href="/category/{{pathesc .}}"
           hx-get="/ui/books?category={{urlquery .}}"
           hx-push-url="/category/{{pathesc .}}"
           hx-target="#book-grid"
           hx-swap="innerHTML">{{.}}</a>
      </li>
      {{end}}
    </ul>
  </div>
  {{end}}

  {{if .Authors}}
  <div class="filter-section">
    <h3 class="filter-heading">Authors</h3>
    <ul class="filter-list">
      {{range .Authors}}
      <li>
        <a class="filter-link"
           href="/author/{{pathesc .}}"
           hx-get="/ui/books?author={{urlquery .}}"
           hx-push-url="/author/{{pathesc .}}"
           hx-target="#book-grid"
           hx-swap="innerHTML">{{.}}</a>
      </li>
      {{end}}
    </ul>
  </div>
  {{end}}

  {{if .Years}}
  <div class="filter-section">
    <h3 class="filter-heading">Year</h3>
    <ul class="filter-list">
      {{range .Years}}
      <li>
        <a class="filter-link"
           href="/year/{{.}}"
           hx-get="/ui/books?year={{.}}"
           hx-push-url="/year/{{.}}"
           hx-target="#book-grid"
           hx-swap="innerHTML">{{.}}</a>
      </li>
      {{end}}
    </ul>
  </div>
  {{end}}
</aside>
{{end}}
