<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swansea Library</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"
          integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@1.3.3/dist/iife/reader/index.js"
          crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body
  x-data="app()"
  @close-modal.window="closeModal()"
  @close-scanner.window="closeScanner()"
>

<header class="header">
  <h1>Swansea Library</h1>
  <nav class="tab-nav">
    <button class="tab-btn" :class="activeTab === 'books' && 'active'"
            hx-get="/ui/books"
            hx-target="#book-grid"
            hx-swap="innerHTML"
            hx-push-url="/"
            @click="switchTab('books', '/ui/filters')">Books</button>
    <button class="tab-btn" :class="activeTab === 'games' && 'active'"
            hx-get="/ui/games"
            hx-target="#book-grid"
            hx-swap="innerHTML"
            hx-push-url="/games"
            @click="switchTab('games', '/ui/games/filters')">Video Games</button>
    <button class="tab-btn" :class="activeTab === 'movies' && 'active'"
            hx-get="/ui/movies"
            hx-target="#book-grid"
            hx-swap="innerHTML"
            hx-push-url="/movies"
            @click="switchTab('movies', '/ui/movies/filters')">Movies</button>
    <button class="tab-btn" :class="activeTab === 'music' && 'active'"
            hx-get="/ui/music"
            hx-target="#book-grid"
            hx-swap="innerHTML"
            hx-push-url="/music"
            @click="switchTab('music', '/ui/music/filters')">Music</button>
  </nav>
  <div class="search-bar">
    <input type="search"
           name="q"
           :placeholder="searchPlaceholder"
           :hx-get="searchURL"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#book-grid"
           hx-swap="innerHTML"
           hx-include="[name='q'],[name='field']"
           autocomplete="off">
    <select name="field">
      <option value="">All</option>
      <option value="title">Title</option>
      <option x-show="activeTab === 'books'" value="author">Author</option>
      <option x-show="activeTab === 'games'" value="developer">Developer</option>
      <option x-show="activeTab === 'movies'" value="director">Director</option>
      <option x-show="activeTab === 'music'" value="artist">Artist</option>
    </select>
  </div>
  <div class="header-actions">
    <div class="layout-toggle">
      <button class="layout-btn" :class="layout === 'grid' && 'active'" @click="setLayout('grid')" title="Grid view">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/>
          <rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>
        </svg>
      </button>
      <button class="layout-btn" :class="layout === 'list' && 'active'" @click="setLayout('list')" title="List view">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <rect x="1" y="2" width="14" height="2.5" rx="1"/><rect x="1" y="6.75" width="14" height="2.5" rx="1"/>
          <rect x="1" y="11.5" width="14" height="2.5" rx="1"/>
        </svg>
      </button>
    </div>
    <button class="btn btn-secondary"
            x-show="activeTab === 'books'"
            @click="openScanner()">
      Scan ISBN
    </button>
    <button class="btn btn-primary"
            @click="openAddModal()"
            x-text="addLabel">
    </button>
  </div>
</header>

<main class="main layout">
  <div id="filter-sidebar"
       hx-get="{{.InitialFiltersURL}}"
       hx-trigger="load"
       hx-swap="innerHTML">
  </div>
  <div id="book-grid"
       :class="layout === 'list' && 'list-mode'"
       hx-get="{{.InitialBooksURL}}"
       hx-trigger="load"
       hx-swap="innerHTML">
    <p class="loading">Loading your library...</p>
  </div>
</main>

<!-- Book modal (add / edit) -->
<dialog id="modal" class="modal">
  <div class="modal-header">
    <h2 id="modal-title"></h2>
    <button class="modal-close" @click="closeModal()">&#x2715;</button>
  </div>
  <div id="modal-body" class="modal-body"></div>
</dialog>

<!-- Scanner modal (books only) -->
<dialog id="scanner-modal" class="modal" x-data="scanner()">
  <div class="modal-header">
    <h2>Add by ISBN</h2>
    <button class="modal-close" @click="closeScanner()">&#x2715;</button>
  </div>

  <div class="scanner-tabs">
    <button :class="tab === 'usb' && 'active'" @click="tab = 'usb'; stopCamera()">USB / Type</button>
    <button :class="tab === 'camera' && 'active'" @click="tab = 'camera'; startCamera()">Camera</button>
  </div>

  <!-- Source selector (shared between tabs) -->
  <div class="source-row">
    <label><input type="radio" x-model="source" value="google"> Google Books</label>
    <label><input type="radio" x-model="source" value="openlibrary"> Open Library</label>
  </div>

  <!-- USB / type tab -->
  <div class="scanner-content" x-show="tab === 'usb'">
    <p class="hint">Scan with a USB barcode scanner, or type the ISBN and press Enter.</p>
    <div class="isbn-input-row">
      <input
        type="text"
        placeholder="978..."
        x-model="isbn"
        @keydown.enter.prevent="lookupISBN()"
        x-ref="usbInput"
      >
      <button class="btn btn-primary" @click="lookupISBN()" :disabled="loading">
        <span x-show="loading" class="spinner" aria-hidden="true"></span>
        <span x-show="!loading">Look up</span>
      </button>
    </div>
  </div>

  <!-- Camera tab -->
  <div class="scanner-content" x-show="tab === 'camera'">
    <div class="camera-container">
      <video x-ref="video" autoplay playsinline class="camera-feed" x-show="cameraActive"></video>
      <div class="camera-placeholder" x-show="!cameraActive">
        <button class="btn btn-primary" @click="startCamera()">Start Camera</button>
      </div>
    </div>
    <p class="error" x-show="cameraError" x-text="cameraError"></p>
  </div>

  <!-- Lookup result (shared between tabs) -->
  <div id="scan-result" style="padding: 0 1.5rem 1.5rem;"></div>
</dialog>

<script>
function app() {
  const initialTab = '{{.ActiveTab}}' || localStorage.getItem('swansea-tab') || 'books';
  return {
    layout: localStorage.getItem('swansea-layout') || 'grid',
    activeTab: initialTab,

    get searchURL() {
      const urls = {
        books:  '/ui/search',
        games:  '/ui/games/search',
        movies: '/ui/movies/search',
        music:  '/ui/music/search',
      };
      return urls[this.activeTab] || '/ui/search';
    },

    get searchPlaceholder() {
      const labels = {
        books:  'Search books…',
        games:  'Search games…',
        movies: 'Search movies…',
        music:  'Search music…',
      };
      return labels[this.activeTab] || 'Search…';
    },

    get addURL() {
      const urls = {
        books:  '/ui/books/add',
        games:  '/ui/games/add',
        movies: '/ui/movies/add',
        music:  '/ui/music/add',
      };
      return urls[this.activeTab] || '/ui/books/add';
    },

    get addLabel() {
      const labels = {
        books:  '+ Add Book',
        games:  '+ Add Game',
        movies: '+ Add Movie',
        music:  '+ Add Album',
      };
      return labels[this.activeTab] || '+ Add';
    },

    switchTab(tab, filtersURL) {
      this.activeTab = tab;
      localStorage.setItem('swansea-tab', tab);
      htmx.ajax('GET', filtersURL, {
        target: '#filter-sidebar',
        swap: 'innerHTML',
      });
    },

    setLayout(v) {
      this.layout = v;
      localStorage.setItem('swansea-layout', v);
    },
    openAddModal() {
      document.getElementById('modal').showModal();
      htmx.ajax('GET', this.addURL, { target: '#modal-body', swap: 'innerHTML' });
    },
    openModal() {
      document.getElementById('modal').showModal();
    },
    closeModal() {
      document.getElementById('modal').close();
      document.getElementById('modal-body').innerHTML = '';
    },
    openScanner() {
      document.getElementById('scanner-modal').showModal();
      this.$nextTick(() => {
        const inp = document.querySelector('#scanner-modal input[x-ref="usbInput"]');
        if (inp) inp.focus();
      });
    },
    closeScanner() {
      const dlg = document.getElementById('scanner-modal');
      const alpine = dlg._x_dataStack && dlg._x_dataStack[0];
      if (alpine) alpine.stopCamera();
      dlg.close();
      document.getElementById('scan-result').innerHTML = '';
    }
  };
}

function scanner() {
  return {
    tab: 'usb',
    isbn: '',
    source: 'google',
    loading: false,
    cameraActive: false,
    cameraError: null,
    stream: null,
    scanning: false,

    lookupISBN() {
      const isbn = this.isbn.trim().replace(/-/g, '');
      if (!isbn) return;
      this.loading = true;
      htmx.ajax('GET', `/ui/lookup/${isbn}?source=${this.source}`, {
        target: '#scan-result',
        swap: 'innerHTML',
      }).then(() => { this.loading = false; });
    },

    async startCamera() {
      this.cameraError = null;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        this.cameraError = 'Camera access is not supported in this browser.';
        return;
      }
      try {
        this.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
        });
        this.$refs.video.srcObject = this.stream;
        this.cameraActive = true;
        this.scanning = true;
        this.detect();
      } catch (e) {
        this.cameraError = 'Camera access denied: ' + e.message;
      }
    },

    async detect() {
      if (!this.scanning) return;
      const video = this.$refs.video;
      if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
        try {
          const canvas = new OffscreenCanvas(video.videoWidth, video.videoHeight);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const results = await ZXingWASM.readBarcodes(imageData, {
            formats: ['EAN-13', 'EAN-8', 'UPC-A', 'UPC-E', 'DataMatrix', 'QRCode'],
            maxNumberOfSymbols: 1,
          });
          if (results.length > 0) {
            const isbn = results[0].text;
            this.stopCamera();
            this.isbn = isbn;
            this.tab = 'usb';
            this.loading = true;
            htmx.ajax('GET', `/ui/lookup/${isbn}?source=${this.source}`, {
              target: '#scan-result',
              swap: 'innerHTML',
            }).then(() => { this.loading = false; });
            return;
          }
        } catch (_) { /* frame not ready */ }
      }
      requestAnimationFrame(() => this.detect());
    },

    stopCamera() {
      this.scanning = false;
      this.cameraActive = false;
      if (this.stream) {
        this.stream.getTracks().forEach(t => t.stop());
        this.stream = null;
      }
    },
  };
}
</script>
</body>
</html>
